[package]
name = "lflauncher"
version = "1.0.0-BETA"
description = "Launcher for Minecraft"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lflauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Management_Deployment", "ApplicationModel", "Management_Core", "Storage", "Storage_Streams", "Security_Authentication_Web", "Security_Authentication_Web_Core", "Security_Credentials", "Security_Cryptography", "Foundation", "Foundation_Collections", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "process", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rfd = "0.15"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = "2.2"
futures-util = "0.3"
md5 = "0.7"
chrono = "0.4"
windows-core = "0.58.0"
dotenvy = "0.15"

[profile.release]
panic = "abort" # Strip fatal error strings
codegen-units = 1 # Optimize across modules
lto = true # Link Time Optimization
opt-level = 3 # Optimize for speed/RAM efficiency
strip = true # Strip symbols and debug info
